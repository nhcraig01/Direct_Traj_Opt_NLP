---
name: "L1 Lyapunov Orbit to L2 NRHO w/ Flybys"
description: "IDK whaever... this is just random testing, go see the other scenarios for real stuff"
dynamics: # This specifies the dynamics model and where to pull the system parameters from (CR3BP only right now)
  type: "CR3BP"
  sys_param_file: '../CR3BP_dev/EarthMoon_System/EMsys.yaml'
integration: # This sets integration tolerances
  a_tol: 1.e-12
  r_tol: 1.e-12
traj_parameters:
  control_arcs: 40 # Number of control arcs
  sub_arcs: 1 # Number of sub-arcs per control arc
  save_pts_detailed: 21 # Number of detailed save points
  MC_trials: 1000 # Number of Monte Carlo trials
boundary_conditions:
  t0: "2026-01-01T00:00:00" # Initial epoch
  tf: "2026-01-21T00:00:00" # Final epoch
  tf_T: 0.5 # Post insertion safety time in days
  initial_orbit: # Intial orbit from external library
    family_path: '../CR3BP_dev/EarthMoon_System/L1_Lyap.h5'
    Orb_ID: 100
    Start_Idx: 0
  final_orbit: # Final orbit from library
    family_path: '../CR3BP_dev/EarthMoon_System/L2_S_Halo.h5'
    Orb_ID: 300
    Start_Idx: 0
  # alpha/beta phasing variable bounds are set via Toggles.alpha_rng/beta_rng,
  # not here - see traj_opt_oop_rework/problem_definition.py
engine: # Engine parameters for mass dynamics and what not
  m0: 200
  Isp: 3337
  T_max: .5
uncertainty:
  covariance:
    initial_dispersion: # Initial deviation covariance
      pos_sig: 10
      vel_sig: .001
      mass_sig: 1.e-12
    initial_error: # Initial estimation error covariance
      pos_sig: .01
      vel_sig: .001
      mass_sig: 1.e-12
    post_insert_target_total: # Target true-state deviation covariance after post-insertion period
      pos_sig: 50
      vel_sig: .01
      mass_sig: 60
  acc_sig: 5.e-12
  measurement: # Measurement uncertainties
    observer_body: 'r1'
    observer_alt_lat_lon: [6371., 0., 0.]
    pos_sig: 1.
    range_sig: 3.e-3
    range_rate_sig: 2.e-5
    angles_sig: 20
  gates:
    fixed_mag: 1.e-3
    prop_mag: 1.e-3
    fixed_point: 1.e-3
    prop_point: 1.e-3
  tcm_stat_bound: .999
  dV_bound: .99
constraints: # Define the collinsion avoidance constraint terms
  col_avoid:
    parameters:
      obj_body: 'r2'
      safe_d: 3000
    det:
      bool: True
    stat:
      bool: False
      bound: .999
      UT:
        alpha: 1.0
        beta: 2.0
        kappa: 4.0