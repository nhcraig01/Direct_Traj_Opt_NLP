<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="383px" preserveAspectRatio="none" style="width:2024px;height:383px;background:#FFFFFF;" version="1.1" viewBox="0 0 2024 383" width="2024px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266" x="872.25" y="22.9951">Gain Parameterization - Hierarchy</text><!--class GainParameterization--><g id="elem_GainParameterization"><rect codeLine="4" fill="#F1F1F1" height="80.5938" id="GainParameterization" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="505" x="859" y="44.2969"/><ellipse cx="1034.75" cy="60.2969" fill="#A9DCDF" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M1034.8594,55.6406 L1033.7031,60.7188 L1036.0313,60.7188 L1034.8594,55.6406 Z M1033.375,53.4063 L1036.3594,53.4063 L1039.7188,65.7969 L1037.2656,65.7969 L1036.5,62.7344 L1033.2188,62.7344 L1032.4688,65.7969 L1030.0313,65.7969 L1033.375,53.4063 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="145" x="1055.25" y="65.1436">GainParameterization</text><line style="stroke:#181818;stroke-width:0.5;" x1="860" x2="1363" y1="76.2969" y2="76.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="860" x2="1363" y1="84.2969" y2="84.2969"/><ellipse cx="870" cy="97.9453" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="879" y="101.292">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="870" cy="114.2422" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="479" x="879" y="117.5889">compute_gains(inputs, error_dynamics, problem_def) : ErrorDynamics</text></g><!--class LQRArcGains--><g id="elem_LQRArcGains"><rect codeLine="9" fill="#F1F1F1" height="80.5938" id="LQRArcGains" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="505" x="7" y="240.7969"/><ellipse cx="210.75" cy="256.7969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M213.7188,262.4375 Q213.1406,262.7344 212.5,262.875 Q211.8594,263.0313 211.1563,263.0313 Q208.6563,263.0313 207.3281,261.3906 Q206.0156,259.7344 206.0156,256.6094 Q206.0156,253.4844 207.3281,251.8281 Q208.6563,250.1719 211.1563,250.1719 Q211.8594,250.1719 212.5,250.3281 Q213.1563,250.4844 213.7188,250.7813 L213.7188,253.5 Q213.0938,252.9219 212.5,252.6563 Q211.9063,252.375 211.2813,252.375 Q209.9375,252.375 209.25,253.4531 Q208.5625,254.5156 208.5625,256.6094 Q208.5625,258.7031 209.25,259.7813 Q209.9375,260.8438 211.2813,260.8438 Q211.9063,260.8438 212.5,260.5781 Q213.0938,260.2969 213.7188,259.7188 L213.7188,262.4375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89" x="231.25" y="261.6436">LQRArcGains</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="511" y1="272.7969" y2="272.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="511" y1="280.7969" y2="280.7969"/><ellipse cx="18" cy="294.4453" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="27" y="297.792">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="18" cy="310.7422" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="479" x="27" y="314.0889">compute_gains(inputs, error_dynamics, problem_def) : ErrorDynamics</text></g><!--class LQRFullTrajGains--><g id="elem_LQRFullTrajGains"><rect codeLine="14" fill="#F1F1F1" height="80.5938" id="LQRFullTrajGains" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="505" x="859" y="240.7969"/><ellipse cx="1049.75" cy="256.7969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M1052.7188,262.4375 Q1052.1406,262.7344 1051.5,262.875 Q1050.8594,263.0313 1050.1563,263.0313 Q1047.6563,263.0313 1046.3281,261.3906 Q1045.0156,259.7344 1045.0156,256.6094 Q1045.0156,253.4844 1046.3281,251.8281 Q1047.6563,250.1719 1050.1563,250.1719 Q1050.8594,250.1719 1051.5,250.3281 Q1052.1563,250.4844 1052.7188,250.7813 L1052.7188,253.5 Q1052.0938,252.9219 1051.5,252.6563 Q1050.9063,252.375 1050.2813,252.375 Q1048.9375,252.375 1048.25,253.4531 Q1047.5625,254.5156 1047.5625,256.6094 Q1047.5625,258.7031 1048.25,259.7813 Q1048.9375,260.8438 1050.2813,260.8438 Q1050.9063,260.8438 1051.5,260.5781 Q1052.0938,260.2969 1052.7188,259.7188 L1052.7188,262.4375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115" x="1070.25" y="261.6436">LQRFullTrajGains</text><line style="stroke:#181818;stroke-width:0.5;" x1="860" x2="1363" y1="272.7969" y2="272.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="860" x2="1363" y1="280.7969" y2="280.7969"/><ellipse cx="870" cy="294.4453" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="879" y="297.792">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="870" cy="310.7422" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="479" x="879" y="314.0889">compute_gains(inputs, error_dynamics, problem_def) : ErrorDynamics</text></g><g id="elem_GMN5"><path d="M547,208.2969 L547,277.2969 L512.02,281.2969 L547,285.2969 L547,354.4922 A0,0 0 0 0 547,354.4922 L824,354.4922 A0,0 0 0 0 824,354.4922 L824,218.2969 L814,208.2969 L547,208.2969 A0,0 0 0 0 547,208.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M814,208.2969 L814,218.2969 L824,218.2969 L814,208.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204" x="553" y="225.3638">variables(): "gain_weights" sized</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192" x="553" y="240.4966">N_arcs x 2 (Q/R weight scalars</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54" x="553" y="255.6294">per arc).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218" x="553" y="270.7622">compute_gains(): solves a per-arc</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237" x="553" y="285.895">LQR using error_dynamics.A_arc_hst/</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255" x="553" y="301.0278">B_arc_hst and the weights, then returns</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256" x="553" y="316.1606">error_dynamics._replace(K_arc_hst=...).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="553" y="331.2935">Maps to "arc_lqr" in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235" x="553" y="346.4263">GainParameterizers() (dynamics.py).</text></g><g id="elem_GMN8"><path d="M1399,208.2969 L1399,277.2969 L1364.02,281.2969 L1399,285.2969 L1399,354.4922 A0,0 0 0 0 1399,354.4922 L1676,354.4922 A0,0 0 0 0 1676,354.4922 L1676,218.2969 L1666,208.2969 L1399,208.2969 A0,0 0 0 0 1399,208.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1666,208.2969 L1666,218.2969 L1676,218.2969 L1666,208.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208" x="1405" y="225.3638">variables(): "gain_weights" with a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="1405" y="240.4966">single (or small) set of weights</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208" x="1405" y="255.6294">applied across the full trajectory.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252" x="1405" y="270.7622">compute_gains(): same LQR machinery</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="1405" y="285.895">as LQRArcGains, but weights are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243" x="1405" y="301.0278">shared/broadcast across arcs; returns</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256" x="1405" y="316.1606">error_dynamics._replace(K_arc_hst=...).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="1405" y="331.2935">Maps to "fulltraj_lqr" in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235" x="1405" y="346.4263">GainParameterizers() (dynamics.py).</text></g><g id="elem_GMN13"><path d="M1711.5,185.2969 L1711.5,376.8906 L2017.5,376.8906 L2017.5,195.2969 L2007.5,185.2969 L1711.5,185.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2007.5,185.2969 L2007.5,195.2969 L2017.5,195.2969 L2007.5,185.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261" x="1717.5" y="202.3638">compute_gains() returns error_dynamics</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208" x="1717.5" y="217.4966">with its K_arc_hst field populated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262" x="1717.5" y="232.6294">(error_dynamics._replace(K_arc_hst=...))</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271" x="1717.5" y="247.7622">rather than returning K_arc_hst separately</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200" x="1717.5" y="262.895">- see 06_data_structures.puml.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="1717.5" y="278.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271" x="1717.5" y="293.1606">DirectGains (K_arc_hst entries themselves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="1717.5" y="308.2935">as optimization variables) is not part of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285" x="1717.5" y="323.4263">the current codebase and has been dropped</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255" x="1717.5" y="338.5591">from this set - can be reintroduced later</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277" x="1717.5" y="353.6919">as a third subclass with the same signature</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63" x="1717.5" y="368.8247">if needed.</text></g><!--reverse link GainParameterization to LQRArcGains--><g id="link_GainParameterization_LQRArcGains"><path codeLine="43" d="M841.0781,122.2605 C738.0881,138.4405 636.16,157.6269 529.5,185.2969 C472.02,200.2069 409.37,221.8969 358.9,240.7869 " fill="none" id="GainParameterization-backto-LQRArcGains" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="858.86,119.4669,840.1469,116.3332,842.0093,128.1878,858.86,119.4669" style="stroke:#181818;stroke-width:1.0;"/></g><!--reverse link GainParameterization to LQRFullTrajGains--><g id="link_GainParameterization_LQRFullTrajGains"><path codeLine="44" d="M1111.5,143.6269 C1111.5,177.1869 1111.5,206.9669 1111.5,240.5169 " fill="none" id="GainParameterization-backto-LQRFullTrajGains" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="1111.5,125.6269,1105.5,143.6269,1117.5,143.6269,1111.5,125.6269" style="stroke:#181818;stroke-width:1.0;"/></g><!--link GainParameterization to GMN13--><g id="link_GainParameterization_GMN13"><path d="M1364.35,110.1269 C1468.33,124.9569 1588.7,148.4369 1693.5,185.2969 C1699.43,187.3769 1705.39,189.6569 1711.35,192.0969 " fill="none" id="GainParameterization-GMN13" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[nLHDRnD13BtdLrWvRKIJ8WuSIa4gAXyIvQCLuhhopZZPgMPt1iziImhyT-pTf4tI210SUafcvzb-VdwUxB8dU8EkXK_8s50cTZUONMXX2cyTCRAfbwCHLYapcWp6OqfznBs0xoE0HrV83YjFgPZ04Povb8y_nkoQ5UZBwlg5OareOfUfN4YsLBXM3ka0Y3bmQPSjDix8ENAGWAQqDDUKh_JwT7Kx-ZaQ3OpEpYzEs2YlzE14NdVUVsQyV50sRSW4x1PrXZ3Vb4TARB0vWh7MAQz9eMaCoTsG5So7KaQVu1iyWUByy08602I37bcJH68Go6Gc_xSfIz8K_1KbG4LD1IKOeG1TSkrYfvNPYLOgwvGF1VLoVG1iBUIQLeMbOpcqm9GxxflOoL8oHO-6YdVh3CzdirdFxZt613d0M2_yLnw3Q-NpZec9TJZ5RSAub60I4gha7Zstflm7KQzThW45fFtBnXM18JNe_GGIzGbNK85WZDwH1JGSn4ygmLnAWUpV9PaSUBbVSUcZrxX1KxkMUAcvjXRZ0Aekhol9x4W9rV9h3oiEQ0sgx4DP7Vwp_rDRMIlfVvPyxojp_6CwtRBpRr7RGng6M8MSGwEYxmkzh-rQXHqD1DYFrOcMjoh0t96t44FiFEP-aOg_asuYK4QPDil8SMrqNPUxv8cYiCtaTRPJEH8yVbfQp5ZAyzmPYI1HiMlyR2I8KyTYcE4Lkgi6r6Psr3khIQHxEZWbR3n8TswUW4iw3v3IwbJ1gYLDnoo9