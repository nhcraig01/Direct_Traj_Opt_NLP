<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="836px" preserveAspectRatio="none" style="width:1272px;height:836px;background:#FFFFFF;" version="1.1" viewBox="0 0 1272 836" width="1272px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="369" x="444.75" y="22.9951">TOP -&gt; PyOptSparse Adapter (to_pyoptsparse)</text><!--class TrajectoryOptimizationProblem--><g id="elem_TrajectoryOptimizationProblem"><rect codeLine="4" fill="#F1F1F1" height="113.1875" id="TrajectoryOptimizationProblem" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="364" x="319" y="44.2969"/><ellipse cx="391.75" cy="60.2969" fill="#A9DCDF" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M391.8594,55.6406 L390.7031,60.7188 L393.0313,60.7188 L391.8594,55.6406 Z M390.375,53.4063 L393.3594,53.4063 L396.7188,65.7969 L394.2656,65.7969 L393.5,62.7344 L390.2188,62.7344 L389.4688,65.7969 L387.0313,65.7969 L390.375,53.4063 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="210" x="412.25" y="65.1436">TrajectoryOptimizationProblem</text><line style="stroke:#181818;stroke-width:0.5;" x1="320" x2="682" y1="76.2969" y2="76.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="320" x2="682" y1="84.2969" y2="84.2969"/><ellipse cx="330" cy="97.9453" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="339" y="101.292">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="330" cy="114.2422" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218" x="339" y="117.5889">constraints() : List&lt;Constraint&gt;</text><ellipse cx="330" cy="130.5391" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="339" y="133.8857">evaluate(inputs) : dict</text><ellipse cx="330" cy="146.8359" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338" x="339" y="150.1826">to_pyoptsparse(init_guess) : (Optimization, sens)</text></g><g id="elem_GMN3"><path d="M6,57.7969 L6,143.4609 A0,0 0 0 0 6,143.4609 L284,143.4609 A0,0 0 0 0 284,143.4609 L284,104.7969 L318.81,100.7969 L284,96.7969 L284,67.7969 L274,57.7969 L6,57.7969 A0,0 0 0 0 6,57.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M274,57.7969 L274,67.7969 L284,67.7969 L274,57.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="12" y="74.8638">variables(), constraints(), and evaluate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246" x="12" y="89.9966">shown here only as the three methods</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="12" y="105.1294">to_pyoptsparse() consumes - see</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210" x="12" y="120.2622">05_top_overview.puml for the full</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="12" y="135.395">interface (propagate(), objective(), etc.).</text></g><!--class OptimizationVariable--><g id="elem_OptimizationVariable"><rect codeLine="19" fill="#F1F1F1" height="129.4844" id="OptimizationVariable" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="172" x="125" y="371.2969"/><ellipse cx="140" cy="387.2969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M142.9688,392.9375 Q142.3906,393.2344 141.75,393.375 Q141.1094,393.5313 140.4063,393.5313 Q137.9063,393.5313 136.5781,391.8906 Q135.2656,390.2344 135.2656,387.1094 Q135.2656,383.9844 136.5781,382.3281 Q137.9063,380.6719 140.4063,380.6719 Q141.1094,380.6719 141.75,380.8281 Q142.4063,380.9844 142.9688,381.2813 L142.9688,384 Q142.3438,383.4219 141.75,383.1563 Q141.1563,382.875 140.5313,382.875 Q139.1875,382.875 138.5,383.9531 Q137.8125,385.0156 137.8125,387.1094 Q137.8125,389.2031 138.5,390.2813 Q139.1875,391.3438 140.5313,391.3438 Q141.1563,391.3438 141.75,391.0781 Q142.3438,390.7969 142.9688,390.2188 L142.9688,392.9375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140" x="154" y="392.1436">OptimizationVariable</text><line style="stroke:#181818;stroke-width:0.5;" x1="126" x2="296" y1="403.2969" y2="403.2969"/><ellipse cx="136" cy="416.9453" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70" x="145" y="420.292">name : str</text><ellipse cx="136" cy="433.2422" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58" x="145" y="436.5889">size : int</text><ellipse cx="136" cy="449.5391" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37" x="145" y="452.8857">lower</text><ellipse cx="136" cy="465.8359" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41" x="145" y="469.1826">upper</text><ellipse cx="136" cy="482.1328" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="145" y="485.4795">value</text><line style="stroke:#181818;stroke-width:0.5;" x1="126" x2="296" y1="492.7813" y2="492.7813"/></g><!--class Constraint--><g id="elem_Constraint"><rect codeLine="27" fill="#F1F1F1" height="145.7813" id="Constraint" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="337" x="332.5" y="362.7969"/><ellipse cx="461.75" cy="378.7969" fill="#A9DCDF" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M461.8594,374.1406 L460.7031,379.2188 L463.0313,379.2188 L461.8594,374.1406 Z M460.375,371.9063 L463.3594,371.9063 L466.7188,384.2969 L464.2656,384.2969 L463.5,381.2344 L460.2188,381.2344 L459.4688,384.2969 L457.0313,384.2969 L460.375,371.9063 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="482.25" y="383.6436">Constraint</text><line style="stroke:#181818;stroke-width:0.5;" x1="333.5" x2="668.5" y1="394.7969" y2="394.7969"/><ellipse cx="343.5" cy="408.4453" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70" x="352.5" y="411.792">name : str</text><ellipse cx="343.5" cy="424.7422" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58" x="352.5" y="428.0889">size : int</text><ellipse cx="343.5" cy="441.0391" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37" x="352.5" y="444.3857">lower</text><ellipse cx="343.5" cy="457.3359" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41" x="352.5" y="460.6826">upper</text><ellipse cx="343.5" cy="473.6328" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188" x="352.5" y="476.9795">linearities : Dict&lt;str, array&gt;</text><line style="stroke:#181818;stroke-width:0.5;" x1="333.5" x2="668.5" y1="484.2813" y2="484.2813"/><ellipse cx="343.5" cy="497.9297" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="352.5" y="501.2764">evaluate(inputs, traj_state, error_state) : array</text></g><g id="elem_GMN10"><path d="M325.5,698.2969 L325.5,829.3594 A0,0 0 0 0 325.5,829.3594 L676.5,829.3594 A0,0 0 0 0 676.5,829.3594 L676.5,708.2969 L666.5,698.2969 L505,698.2969 L501,509.1469 L497,698.2969 L325.5,698.2969 A0,0 0 0 0 325.5,698.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M666.5,698.2969 L666.5,708.2969 L676.5,708.2969 L666.5,698.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="331.5" y="715.3638">linearities defaults to {}. Only populated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273" x="331.5" y="730.4966">at construction time when the constraint is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276" x="331.5" y="745.6294">FULLY linear in every variable it depends on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296" x="331.5" y="760.7622">(today: AdaptiveMeshConstraint only). Its keys</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281" x="331.5" y="775.895">are the "wrt" variable names. Never partially</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330" x="331.5" y="791.0278">populated - pyOptSparse's addConGroup(linear=...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284" x="331.5" y="806.1606">is an all-or-nothing flag per constraint group,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285" x="331.5" y="821.2935">so a partially-linear dict would be misleading.</text></g><g id="elem_GMN13"><path d="M704.5,234.2969 L704.5,237.7369 L581.74,157.3469 L704.5,245.7369 L704.5,637.75 A0,0 0 0 0 704.5,637.75 L1265.5,637.75 A0,0 0 0 0 1265.5,637.75 L1265.5,244.2969 L1255.5,234.2969 L704.5,234.2969 A0,0 0 0 0 704.5,234.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1255.5,234.2969 L1255.5,244.2969 L1265.5,244.2969 L1255.5,234.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177" x="710.5" y="251.3638">to_pyoptsparse(init_guess):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302" x="710.5" y="266.4966">1. optprob = Optimization(name, self.evaluate)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160" x="710.5" y="281.6294">2. for v in self.variables():</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265" x="730.5" y="296.7622">optprob.addVarGroup(v.name, v.size, "c",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372" x="738.5" y="311.895">value=init_guess[v.name], lower=v.lower, upper=v.upper)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139" x="710.5" y="327.0278">3. optprob.addObj('o')</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="710.5" y="342.1606">4. grad = jit(jacfwd(self.evaluate))</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225" x="722.5" y="357.2935">grad_nonsparse = grad(init_guess)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318" x="722.5" y="372.4263">grad_sparse = process_sparsity(grad_nonsparse)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174" x="710.5" y="387.5591">5. for c in self.constraints():</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87" x="730.5" y="402.6919">if c.linearities:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443" x="738.5" y="417.8247">optprob.addConGroup(c.name, c.size, lower=c.lower, upper=c.upper,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369" x="746.5" y="432.9575">linear=True, wrt=list(c.linearities.keys()), jac=c.linearities)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="30" x="730.5" y="448.0903">else:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443" x="738.5" y="463.2231">optprob.addConGroup(c.name, c.size, lower=c.lower, upper=c.upper,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="504" x="746.5" y="478.356">linear=False, wrt=list(grad_sparse[c.name].keys()), jac=grad_sparse[c.name])</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303" x="710.5" y="493.4888">6. sens = jit(lambda inputs, cvals: grad(inputs))</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147" x="710.5" y="508.6216">7. return optprob, sens</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="710.5" y="523.7544">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105" x="710.5" y="538.8872">Caller then runs:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="471" x="718.5" y="554.02">sol = SNOPT(options=optOptions)(optprob, sens=sens, timeLimit=None)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="710.5" y="569.1528">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245" x="710.5" y="584.2856">Intentionally PyOptSparse-specific - no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247" x="710.5" y="599.4185">separate solver-adapter abstraction. A</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259" x="710.5" y="614.5513">future solver swap would mean replacing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109" x="710.5" y="629.6841">this one method.</text></g><!--reverse link TrajectoryOptimizationProblem to OptimizationVariable--><g id="link_TrajectoryOptimizationProblem_OptimizationVariable"><path codeLine="36" d="M395.0953,164.1323 C363.7853,185.4123 340.48,204.9669 315,234.2969 C279.9,274.7069 252.66,329.0269 234.88,370.9369 " fill="none" id="TrajectoryOptimizationProblem-backto-OptimizationVariable" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="405.02,157.3869,397.8092,157.4513,395.0953,164.1323,402.3061,164.0678,405.02,157.3869" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67" x="361" y="200.3638">variables()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8" x="384.2101" y="177.6618">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="199.5231" y="360.0702">many</text></g><!--reverse link TrajectoryOptimizationProblem to Constraint--><g id="link_TrajectoryOptimizationProblem_Constraint"><path codeLine="37" d="M501,169.5369 C501,225.8169 501,301.0069 501,362.5669 " fill="none" id="TrajectoryOptimizationProblem-backto-Constraint" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="501,157.5369,497,163.5369,501,169.5369,505,163.5369,501,157.5369" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96" x="502" y="200.3638">constraints_list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8" x="492.5125" y="177.4297">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="463.2281" y="351.7042">many</text></g><!--SRC=[jLPjYnit4FxkNp7uo-tIjMZQfW6J3OIKbC3rV91h8OHWPEtiMLTPMYIjZHFotpkZNTlQuvhIGWtsMj9eNXuzysYZZWRXRdKBYrTmUrnryNqdVK1utSWkeeSYkdLtT5qCQRwSpUGcH2zL16La273dvGEgw3nlrZlzMKRjxArt6uCx-383-6ullPOq34K9IxZM8RxCRVyObr-nhNAMtMiRC-itvybaWtjfUXcnqBRhOs2pHgl8IzDioK37zNsF8HaLUTGA0jfGphxEPjP518Dj1DT-knuAaHLJmIJR2gHju9nSISPXwmuMjkWHd3L7a07Y5kdh4M67SUkQG6QFiYwJttw70HQK9PB5zy_NqNLhjqU_rtWGNRypq3gVtBMzCMH3MQ1lfK8eEkywUP-ogC1jk22zJmECIfHYXfGfbpsR3QVur7aCXsVb3WaxAfD7GN_c4ONYaN47JDDzrmr_k7XaJ1-nv7A2_yMhqHOfgQW9aINyGcVzadOItjxBurEKg822FQn3f2cgsNldXm7J8EtY7BzDtVcpERZ50kOxQO_pfn5QvdJuT_uoH9OvZzQ663zoSkDYT3jcvSMQgitXQB2LlOd4AmTVlWfOCSqwr_M6gct8MCRHUwyu6w3440vRj8awby2WcOblVx- -_Z06eFCWDgC_dei47IbWH-G9n6So9tLev74vg0Knx3SCswmmv