<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="378px" preserveAspectRatio="none" style="width:1880px;height:378px;background:#FFFFFF;" version="1.1" viewBox="0 0 1880 378" width="1880px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="547" x="659.75" y="22.9951">Core Data Structures - the sol_data dict pattern, OptimizationVariable</text><g id="elem_N0"><path d="M925,43.2969 L925,371.0859 L1347,371.0859 L1347,53.2969 L1337,43.2969 L925,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1337,43.2969 L1337,53.2969 L1347,53.2969 L1337,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401" x="931" y="60.3638">UPDATED: the typed TrajectoryState/ErrorDynamics/ErrorState</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401" x="931" y="75.4966">NamedTuple pytrees this diagram used to describe were never</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371" x="931" y="90.6294">built this way. What actually shipped: a single flat, mutable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378" x="931" y="105.7622">dict called sol_data, threaded through every pipeline stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="931" y="120.895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268" x="931" y="136.0278">Every stage method has the same shape:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199" x="939" y="151.1606">(problem_def, sol_data) -&gt; dict</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360" x="931" y="166.2935">It reads whatever keys it needs, adds/overwrites keys for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392" x="931" y="181.4263">whatever it computed, and returns the same dict (mutated in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369" x="931" y="196.5591">place - JAX is fine with dict mutation under jit/vmap/jacfwd,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313" x="931" y="211.6919">same as it was fine with NamedTuple._replace()).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="931" y="226.8247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341" x="931" y="241.9575">Why: the math is still evolving (e.g. higher-order state</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380" x="931" y="257.0903">transition tensors were being discussed as a future addition</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345" x="931" y="272.2231">at time of writing) and the set of fields a given pipeline</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387" x="931" y="287.356">needs is not yet stable. Pre-declaring a typed schema forces</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377" x="931" y="302.4888">guessing field names/defaults ahead of time; a flat dict lets</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378" x="931" y="317.6216">a new field show up with a one-line sol_data['new_key'] = ...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370" x="931" y="332.7544">wherever it's actually computed, with no upstream type to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359" x="931" y="347.8872">touch. No docstring enumerates "which keys each stage</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318" x="931" y="363.02">populates" by design - read the stage's own body.</text></g><!--class OptimizationVariable--><g id="elem_OptimizationVariable"><rect codeLine="28" fill="#F1F1F1" height="145.7813" id="OptimizationVariable" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="388" x="7" y="134.2969"/><ellipse cx="126.75" cy="150.2969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M129.7188,155.9375 Q129.1406,156.2344 128.5,156.375 Q127.8594,156.5313 127.1563,156.5313 Q124.6563,156.5313 123.3281,154.8906 Q122.0156,153.2344 122.0156,150.1094 Q122.0156,146.9844 123.3281,145.3281 Q124.6563,143.6719 127.1563,143.6719 Q127.8594,143.6719 128.5,143.8281 Q129.1563,143.9844 129.7188,144.2813 L129.7188,147 Q129.0938,146.4219 128.5,146.1563 Q127.9063,145.875 127.2813,145.875 Q125.9375,145.875 125.25,146.9531 Q124.5625,148.0156 124.5625,150.1094 Q124.5625,152.2031 125.25,153.2813 Q125.9375,154.3438 127.2813,154.3438 Q127.9063,154.3438 128.5,154.0781 Q129.0938,153.7969 129.7188,153.2188 L129.7188,155.9375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140" x="147.25" y="155.1436">OptimizationVariable</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="394" y1="166.2969" y2="166.2969"/><ellipse cx="18" cy="179.9453" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70" x="27" y="183.292">name : str</text><ellipse cx="18" cy="196.2422" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58" x="27" y="199.5889">size : int</text><ellipse cx="18" cy="212.5391" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83" x="27" y="215.8857">lower : array</text><ellipse cx="18" cy="228.8359" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87" x="27" y="232.1826">upper : array</text><ellipse cx="18" cy="245.1328" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200" x="27" y="248.4795">value : array      ' default value</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="394" y1="255.7813" y2="255.7813"/><ellipse cx="18" cy="269.4297" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="362" x="27" y="272.7764">guess_fn : callable ' (key) -&gt; array, random init guess</text></g><g id="elem_GMN4"><path d="M430.5,134.2969 L430.5,203.2969 L395.09,207.2969 L430.5,211.2969 L430.5,280.4922 A0,0 0 0 0 430.5,280.4922 L889.5,280.4922 A0,0 0 0 0 889.5,280.4922 L889.5,144.2969 L879.5,134.2969 L430.5,134.2969 A0,0 0 0 0 430.5,134.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M879.5,134.2969 L879.5,144.2969 L889.5,144.2969 L879.5,134.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438" x="436.5" y="151.3638">Still a genuine typed NamedTuple (src/problem/data_structures.py) -</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333" x="436.5" y="166.4966">this is the one exception to the flat-dict pattern, and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353" x="436.5" y="181.6294">deliberately so: it's build-time-only (never enters traced</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388" x="436.5" y="196.7622">code, never flows through evaluate()), so the "don't know the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277" x="436.5" y="211.895">future schema" problem doesn't apply to it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="436.5" y="227.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387" x="436.5" y="242.1606">One instance per addVarGroup() call. TOP.variables() returns</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369" x="436.5" y="257.2935">list[OptimizationVariable]; TOP.to_pyoptsparse() turns the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315" x="436.5" y="272.4263">list into the actual optprob.addVarGroup(...) calls.</text></g><g id="elem_N1"><path d="M1382.5,58.2969 L1382.5,355.8203 L1873.5,355.8203 L1873.5,68.2969 L1863.5,58.2969 L1382.5,58.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1863.5,58.2969 L1863.5,68.2969 L1873.5,68.2969 L1863.5,58.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393" x="1388.5" y="75.3638">Typical sol_data key growth through StochasticTOP.evaluate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346" x="1388.5" y="90.4966">(src/optimization/trajectory_optimization_problem.py):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="1388.5" y="105.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="462" x="1396.5" y="120.7622">sol_data = dict(inputs)   ' U_arc_hst, X0, Xf, alpha, beta, gain_weights, ...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="1388.5" y="135.895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366" x="1396.5" y="151.0278">sol_data = propagator.propagate(problem_def, sol_data)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189" x="1404.5" y="166.1606">+ X_hst, t_hst, t_node_bound</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434" x="1404.5" y="181.2935">+ (stochastic only) A_hst, B_hst, A_arc_hst, B_arc_hst, A_postinsert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="1388.5" y="196.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403" x="1396.5" y="211.5591">sol_data = gain_param.compute_gains(problem_def, sol_data)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77" x="1404.5" y="226.6919">+ K_arc_hst</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="1388.5" y="241.8247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433" x="1396.5" y="256.9575">sol_data = error_propagator.propagate_cov(problem_def, sol_data)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231" x="1404.5" y="272.0903">+ true_state:      P_hst, P_U_arc_hst</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="1404.5" y="287.2231">+ true_state_sqrt:  Saug_hst, KS_arc_hst</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="449" x="1404.5" y="302.356">+ estimated_state:  Paug_hst, P_U_arc_hst, L_arc_hst, H_hst, P_v_hst</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="1388.5" y="317.4888">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428" x="1396.5" y="332.6216">J = objective(sol_data)                       ' reads whatever keys it needs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405" x="1396.5" y="347.7544">for c in constraints(): c.evaluate(problem_def, sol_data)  ' same</text></g><!--SRC=[XLRRZjis47ttLmpsnJRMbjDN5ocmwGPjao9PO3TDW20GQ6biCP58bgJiAaN_lMT8-P9cqnXOh4JEVSwPKTInPVhPUgPR5HNTHzzNiVSSQ4cnOGgsBMkvgNKLoQaOsPi5lNPHT_gpYjgQFvJNQjFoP69iP5A1NZsP4BsvkxrvU7wxJcRYuBYc1wy-SXMj7-wZYhnwxhtrjuDHdQv2VaiNq7wbEguVUeVet10z8w3Ow80mrCwhZle0Uz5IpQ7oUiDqOEHWUCyUsfjUjp4h7DHGqDj6HL98JBNjGA7H3k6iIL7GPWSNsrR51NLzJ7bGJhQ2C9mSAx20FS-g5h-Dj_sk8V4saDEEMsrGgwXsN4oW_pnTf7VgE3QsfaQ5N50aXWYKupK4YMREMpZjofgtYvEpEIr_Ib50vhT8uXUf80jnIPzu2AGZqkKwB4ZLTLXPN1oyZYXKkjvQASH91TALxLmVkOQ2gM4IRJONCQMSPr83o90sq7QjgXX0U77pZb3AhIHvqB79iaaK_QVUrF3mKSVLlbDkzL5LsqEzW7wogrAe1tMfV-vkKNfERcRpUIhTssR8aEaK1E4rHDssABLjzsWMpRZO5TJeNSD-QRru3YDcebScw1HIP1Ei3naL6nR5MeUg3m8RXA9esmlCfNP90-g0243DPBSaXOJEF5KgLOYZd6yrjxLex_IUpQdpK4wja7310HeW7HAM2hhplAovQa4I1A569eIguKv9aoeEKD_r70IBsGE14HnMG8JgsmX_3Vel_YM-7oLuu3KteUKe-We174RbqDW3zIvNMf4rlCpm7B7rVWhP4Y2PVg2dL1H5mWaAbN4o3MUcd26JZ1aBkm