<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="627px" preserveAspectRatio="none" style="width:1256px;height:627px;background:#FFFFFF;" version="1.1" viewBox="0 0 1256 627" width="1256px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="429" x="406.5" y="22.9951">Trajectory Optimization Problem - Top-Level Hierarchy</text><!--class TrajectoryOptimizationProblem--><g id="elem_TrajectoryOptimizationProblem"><rect codeLine="4" fill="#F1F1F1" height="194.6719" id="TrajectoryOptimizationProblem" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="392" x="329.5" y="139.7969"/><ellipse cx="416.25" cy="155.7969" fill="#A9DCDF" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M416.3594,151.1406 L415.2031,156.2188 L417.5313,156.2188 L416.3594,151.1406 Z M414.875,148.9063 L417.8594,148.9063 L421.2188,161.2969 L418.7656,161.2969 L418,158.2344 L414.7188,158.2344 L413.9688,161.2969 L411.5313,161.2969 L414.875,148.9063 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="210" x="436.75" y="160.6436">TrajectoryOptimizationProblem</text><line style="stroke:#181818;stroke-width:0.5;" x1="330.5" x2="720.5" y1="171.7969" y2="171.7969"/><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="337.5" y="182.4453"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="349.5" y="188.792">propagator : Propagator</text><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="337.5" y="198.7422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234" x="349.5" y="205.0889">constraints_list : List&lt;Constraint&gt;</text><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="337.5" y="215.0391"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="349.5" y="221.3857">problem_def : ProblemDefinition</text><line style="stroke:#181818;stroke-width:0.5;" x1="330.5" x2="720.5" y1="228.6875" y2="228.6875"/><ellipse cx="340.5" cy="242.3359" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="349.5" y="245.6826">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="340.5" cy="258.6328" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="366" x="349.5" y="261.9795">propagate(inputs) : (TrajectoryState, ErrorDynamics?)</text><ellipse cx="340.5" cy="274.9297" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="349.5" y="278.2764">objective(inputs, traj_state, error_state) : float</text><ellipse cx="340.5" cy="291.2266" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218" x="349.5" y="294.5732">constraints() : List&lt;Constraint&gt;</text><ellipse cx="340.5" cy="307.5234" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="349.5" y="310.8701">evaluate(inputs) : dict</text><ellipse cx="340.5" cy="323.8203" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338" x="349.5" y="327.167">to_pyoptsparse(init_guess) : (Optimization, sens)</text></g><!--class DeterministicTOP--><g id="elem_DeterministicTOP"><rect codeLine="16" fill="#F1F1F1" height="96.8906" id="DeterministicTOP" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="337" x="707" y="507.2969"/><ellipse cx="811.25" cy="523.2969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M814.2188,528.9375 Q813.6406,529.2344 813,529.375 Q812.3594,529.5313 811.6563,529.5313 Q809.1563,529.5313 807.8281,527.8906 Q806.5156,526.2344 806.5156,523.1094 Q806.5156,519.9844 807.8281,518.3281 Q809.1563,516.6719 811.6563,516.6719 Q812.3594,516.6719 813,516.8281 Q813.6563,516.9844 814.2188,517.2813 L814.2188,520 Q813.5938,519.4219 813,519.1563 Q812.4063,518.875 811.7813,518.875 Q810.4375,518.875 809.75,519.9531 Q809.0625,521.0156 809.0625,523.1094 Q809.0625,525.2031 809.75,526.2813 Q810.4375,527.3438 811.7813,527.3438 Q812.4063,527.3438 813,527.0781 Q813.5938,526.7969 814.2188,526.2188 L814.2188,528.9375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120" x="831.75" y="528.1436">DeterministicTOP</text><line style="stroke:#181818;stroke-width:0.5;" x1="708" x2="1043" y1="539.2969" y2="539.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="708" x2="1043" y1="547.2969" y2="547.2969"/><ellipse cx="718" cy="560.9453" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="727" y="564.292">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="718" cy="577.2422" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="727" y="580.5889">objective(inputs, traj_state, error_state) : float</text><ellipse cx="718" cy="593.5391" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="727" y="596.8857">evaluate(inputs) : dict</text></g><!--class StochasticTOP--><g id="elem_StochasticTOP"><rect codeLine="22" fill="#F1F1F1" height="129.4844" id="StochasticTOP" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="337" x="7" y="491.2969"/><ellipse cx="120.75" cy="507.2969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M123.7188,512.9375 Q123.1406,513.2344 122.5,513.375 Q121.8594,513.5313 121.1563,513.5313 Q118.6563,513.5313 117.3281,511.8906 Q116.0156,510.2344 116.0156,507.1094 Q116.0156,503.9844 117.3281,502.3281 Q118.6563,500.6719 121.1563,500.6719 Q121.8594,500.6719 122.5,500.8281 Q123.1563,500.9844 123.7188,501.2813 L123.7188,504 Q123.0938,503.4219 122.5,503.1563 Q121.9063,502.875 121.2813,502.875 Q119.9375,502.875 119.25,503.9531 Q118.5625,505.0156 118.5625,507.1094 Q118.5625,509.2031 119.25,510.2813 Q119.9375,511.3438 121.2813,511.3438 Q121.9063,511.3438 122.5,511.0781 Q123.0938,510.7969 123.7188,510.2188 L123.7188,512.9375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101" x="141.25" y="512.1436">StochasticTOP</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="343" y1="523.2969" y2="523.2969"/><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="15" y="533.9453"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239" x="27" y="540.292">gain_param : GainParameterization</text><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="15" y="550.2422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="249" x="27" y="556.5889">controller : FeedbackControlMethod</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="343" y1="563.8906" y2="563.8906"/><ellipse cx="18" cy="577.5391" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="27" y="580.8857">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="18" cy="593.8359" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="27" y="597.1826">objective(inputs, traj_state, error_state) : float</text><ellipse cx="18" cy="610.1328" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="27" y="613.4795">evaluate(inputs) : dict</text></g><g id="elem_GMN7"><path d="M756,43.2969 L756,233.2969 L721.61,237.2969 L756,241.2969 L756,431.6172 A0,0 0 0 0 756,431.6172 L1249,431.6172 A0,0 0 0 0 1249,431.6172 L1249,53.2969 L1239,43.2969 L756,43.2969 A0,0 0 0 0 756,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1239,43.2969 L1239,53.2969 L1249,53.2969 L1239,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197" x="762" y="60.3638">propagate(), constraints(), and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="762" y="75.4966">to_pyoptsparse() are CONCRETE here -</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185" x="762" y="90.6294">identical for both subclasses:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="464" x="770" y="105.7622">propagate(inputs) = self.propagator.propagate(inputs, self.problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238" x="770" y="120.895">constraints()     = self.constraints_list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354" x="770" y="136.0278">to_pyoptsparse()  = see 09_optimization_adapter.puml</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="762" y="151.1606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243" x="762" y="166.2935">variables(), objective(), and evaluate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213" x="762" y="181.4263">are abstract - overridden by each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253" x="762" y="196.5591">subclass. error_state is always None for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273" x="762" y="211.6919">DeterministicTOP; its objective()/evaluate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101" x="762" y="226.8247">simply ignore it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="762" y="241.9575">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231" x="762" y="257.0903">variables() is a flat, toggle-driven list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247" x="762" y="272.2231">built from problem_def (core trajectory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267" x="762" y="287.356">variables U_arc_hst/X0/Xf, plus alpha/beta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203" x="762" y="302.4888">if free_phasing, t_node_bound if</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244" x="762" y="317.6216">adaptive_mesh, etc.) - mirrors today's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260" x="762" y="332.7544">dir_traj_opt.py addVarGroup() sequence.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227" x="762" y="347.8872">StochasticTOP additionally appends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247" x="762" y="363.02">self.gain_param.variables(). Constraint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251" x="762" y="378.1528">subclasses do NOT contribute variables</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="762" y="393.2856">(see 05_constraints.puml) - this keeps a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224" x="762" y="408.4185">single, traceable place where every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223" x="762" y="423.5513">optimization variable is introduced.</text></g><g id="elem_GMN10"><path d="M379.5,505.2969 L379.5,551.7969 L344.01,555.7969 L379.5,559.7969 L379.5,606.0938 A0,0 0 0 0 379.5,606.0938 L671.5,606.0938 A0,0 0 0 0 671.5,606.0938 L671.5,515.2969 L661.5,505.2969 L379.5,505.2969 A0,0 0 0 0 379.5,505.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M661.5,505.2969 L661.5,515.2969 L671.5,515.2969 L661.5,505.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263" x="385.5" y="522.3638">Composes a GainParameterization and a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258" x="385.5" y="537.4966">FeedbackControlMethod as independent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219" x="385.5" y="552.6294">strategy objects, in addition to the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271" x="385.5" y="567.7622">propagator / constraints_list / problem_def</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262" x="385.5" y="582.895">inherited from the base class. Detailed in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241" x="385.5" y="598.0278">04_stochastic_top_composition.puml.</text></g><!--reverse link TrajectoryOptimizationProblem to DeterministicTOP--><g id="link_TrajectoryOptimizationProblem_DeterministicTOP"><path codeLine="30" d="M645.2395,346.8923 C679.2795,377.7323 703.79,399.9269 738.5,431.2969 C766.18,456.3069 797.04,484.1369 822.45,507.0269 " fill="none" id="TrajectoryOptimizationProblem-backto-DeterministicTOP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="631.9,334.8069,641.211,351.3388,649.268,342.4459,631.9,334.8069" style="stroke:#181818;stroke-width:1.0;"/></g><!--reverse link TrajectoryOptimizationProblem to StochasticTOP--><g id="link_TrajectoryOptimizationProblem_StochasticTOP"><path codeLine="31" d="M405.239,347.0496 C349.149,397.7696 295.36,446.4169 245.86,491.1669 " fill="none" id="TrajectoryOptimizationProblem-backto-StochasticTOP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="418.59,334.9769,401.2148,342.5993,409.2633,351.5,418.59,334.9769" style="stroke:#181818;stroke-width:1.0;"/></g><!--SRC=[nLN1Sjis4BtpA_PMQInIFhI7fcbxi9tqaDgUHEtanW799Oa41500L8PD-k_T1IKAajDCsqjyiK3kBjvx-tOPP508EoVUOHsCc-311Zd8FqMGHiEZCvN20NBO6Pk_mZqg-4MY4wxkfomJbGzEr05g9RnFggH5ZZK-PW2vTSQAJb0CFEFgXmE_getc