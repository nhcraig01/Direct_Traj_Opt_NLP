<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="688px" preserveAspectRatio="none" style="width:1256px;height:688px;background:#FFFFFF;" version="1.1" viewBox="0 0 1256 688" width="1256px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="429" x="406.5" y="22.9951">Trajectory Optimization Problem - Top-Level Hierarchy</text><!--class TrajectoryOptimizationProblem--><g id="elem_TrajectoryOptimizationProblem"><rect codeLine="4" fill="#F1F1F1" height="194.6719" id="TrajectoryOptimizationProblem" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="392" x="329.5" y="170.2969"/><ellipse cx="416.25" cy="186.2969" fill="#A9DCDF" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M416.3594,181.6406 L415.2031,186.7188 L417.5313,186.7188 L416.3594,181.6406 Z M414.875,179.4063 L417.8594,179.4063 L421.2188,191.7969 L418.7656,191.7969 L418,188.7344 L414.7188,188.7344 L413.9688,191.7969 L411.5313,191.7969 L414.875,179.4063 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="210" x="436.75" y="191.1436">TrajectoryOptimizationProblem</text><line style="stroke:#181818;stroke-width:0.5;" x1="330.5" x2="720.5" y1="202.2969" y2="202.2969"/><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="337.5" y="212.9453"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="349.5" y="219.292">propagator : Propagator</text><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="337.5" y="229.2422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234" x="349.5" y="235.5889">constraints_list : List&lt;Constraint&gt;</text><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="337.5" y="245.5391"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="349.5" y="251.8857">problem_def : ProblemDefinition</text><line style="stroke:#181818;stroke-width:0.5;" x1="330.5" x2="720.5" y1="259.1875" y2="259.1875"/><ellipse cx="340.5" cy="272.8359" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="349.5" y="276.1826">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="340.5" cy="289.1328" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="366" x="349.5" y="292.4795">propagate(inputs) : (TrajectoryState, ErrorDynamics?)</text><ellipse cx="340.5" cy="305.4297" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="349.5" y="308.7764">objective(inputs, traj_state, error_state) : float</text><ellipse cx="340.5" cy="321.7266" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218" x="349.5" y="325.0732">constraints() : List&lt;Constraint&gt;</text><ellipse cx="340.5" cy="338.0234" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="349.5" y="341.3701">evaluate(inputs) : dict</text><ellipse cx="340.5" cy="354.3203" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338" x="349.5" y="357.667">to_pyoptsparse(init_guess) : (Optimization, sens)</text></g><!--class DeterministicTOP--><g id="elem_DeterministicTOP"><rect codeLine="16" fill="#F1F1F1" height="96.8906" id="DeterministicTOP" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="337" x="707" y="568.2969"/><ellipse cx="811.25" cy="584.2969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M814.2188,589.9375 Q813.6406,590.2344 813,590.375 Q812.3594,590.5313 811.6563,590.5313 Q809.1563,590.5313 807.8281,588.8906 Q806.5156,587.2344 806.5156,584.1094 Q806.5156,580.9844 807.8281,579.3281 Q809.1563,577.6719 811.6563,577.6719 Q812.3594,577.6719 813,577.8281 Q813.6563,577.9844 814.2188,578.2813 L814.2188,581 Q813.5938,580.4219 813,580.1563 Q812.4063,579.875 811.7813,579.875 Q810.4375,579.875 809.75,580.9531 Q809.0625,582.0156 809.0625,584.1094 Q809.0625,586.2031 809.75,587.2813 Q810.4375,588.3438 811.7813,588.3438 Q812.4063,588.3438 813,588.0781 Q813.5938,587.7969 814.2188,587.2188 L814.2188,589.9375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120" x="831.75" y="589.1436">DeterministicTOP</text><line style="stroke:#181818;stroke-width:0.5;" x1="708" x2="1043" y1="600.2969" y2="600.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="708" x2="1043" y1="608.2969" y2="608.2969"/><ellipse cx="718" cy="621.9453" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="727" y="625.292">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="718" cy="638.2422" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="727" y="641.5889">objective(inputs, traj_state, error_state) : float</text><ellipse cx="718" cy="654.5391" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="727" y="657.8857">evaluate(inputs) : dict</text></g><!--class StochasticTOP--><g id="elem_StochasticTOP"><rect codeLine="22" fill="#F1F1F1" height="129.4844" id="StochasticTOP" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="337" x="7" y="552.2969"/><ellipse cx="120.75" cy="568.2969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M123.7188,573.9375 Q123.1406,574.2344 122.5,574.375 Q121.8594,574.5313 121.1563,574.5313 Q118.6563,574.5313 117.3281,572.8906 Q116.0156,571.2344 116.0156,568.1094 Q116.0156,564.9844 117.3281,563.3281 Q118.6563,561.6719 121.1563,561.6719 Q121.8594,561.6719 122.5,561.8281 Q123.1563,561.9844 123.7188,562.2813 L123.7188,565 Q123.0938,564.4219 122.5,564.1563 Q121.9063,563.875 121.2813,563.875 Q119.9375,563.875 119.25,564.9531 Q118.5625,566.0156 118.5625,568.1094 Q118.5625,570.2031 119.25,571.2813 Q119.9375,572.3438 121.2813,572.3438 Q121.9063,572.3438 122.5,572.0781 Q123.0938,571.7969 123.7188,571.2188 L123.7188,573.9375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101" x="141.25" y="573.1436">StochasticTOP</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="343" y1="584.2969" y2="584.2969"/><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="15" y="594.9453"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239" x="27" y="601.292">gain_param : GainParameterization</text><rect fill="none" height="6" style="stroke:#C82930;stroke-width:1.0;" width="6" x="15" y="611.2422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="249" x="27" y="617.5889">controller : FeedbackControlMethod</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="343" y1="624.8906" y2="624.8906"/><ellipse cx="18" cy="638.5391" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270" x="27" y="641.8857">variables() : List&lt;OptimizationVariable&gt;</text><ellipse cx="18" cy="654.8359" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="311" x="27" y="658.1826">objective(inputs, traj_state, error_state) : float</text><ellipse cx="18" cy="671.1328" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="27" y="674.4795">evaluate(inputs) : dict</text></g><g id="elem_GMN7"><path d="M756,43.2969 L756,263.7969 L721.61,267.7969 L756,271.7969 L756,492.1484 A0,0 0 0 0 756,492.1484 L1249,492.1484 A0,0 0 0 0 1249,492.1484 L1249,53.2969 L1239,43.2969 L756,43.2969 A0,0 0 0 0 756,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1239,43.2969 L1239,53.2969 L1249,53.2969 L1239,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197" x="762" y="60.3638">propagate(), constraints(), and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="762" y="75.4966">to_pyoptsparse() are CONCRETE here -</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185" x="762" y="90.6294">identical for both subclasses:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="464" x="770" y="105.7622">propagate(inputs) = self.propagator.propagate(inputs, self.problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238" x="770" y="120.895">constraints()     = self.constraints_list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354" x="770" y="136.0278">to_pyoptsparse()  = see 10_optimization_adapter.puml</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="762" y="151.1606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243" x="762" y="166.2935">variables(), objective(), and evaluate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213" x="762" y="181.4263">are abstract - overridden by each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253" x="762" y="196.5591">subclass. error_state is always None for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273" x="762" y="211.6919">DeterministicTOP; its objective()/evaluate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101" x="762" y="226.8247">simply ignore it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="762" y="241.9575">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231" x="762" y="257.0903">variables() is a flat, toggle-driven list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247" x="762" y="272.2231">built from problem_def (core trajectory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266" x="762" y="287.356">variables U_arc_hst/X0/Xf, alpha/beta with</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301" x="762" y="302.4888">bounds from problem_def.boundary_conditions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309" x="762" y="317.6216">.alpha_min/max/beta_min/max - themselves set</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228" x="762" y="332.7544">via toggles.alpha_rng/beta_rng, see</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216" x="762" y="347.8872">02_problem_definition.puml - plus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250" x="762" y="363.02">t_node_bound if adaptive_mesh, etc.) -</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191" x="762" y="378.1528">mirrors today's dir_traj_opt.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261" x="762" y="393.2856">addVarGroup() sequence. StochasticTOP</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131" x="762" y="408.4185">additionally appends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247" x="762" y="423.5513">self.gain_param.variables(). Constraint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251" x="762" y="438.6841">subclasses do NOT contribute variables</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="762" y="453.8169">(see 04_constraints.puml) - this keeps a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224" x="762" y="468.9497">single, traceable place where every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223" x="762" y="484.0825">optimization variable is introduced.</text></g><g id="elem_GMN10"><path d="M379.5,566.2969 L379.5,612.7969 L344.01,616.7969 L379.5,620.7969 L379.5,667.0938 A0,0 0 0 0 379.5,667.0938 L671.5,667.0938 A0,0 0 0 0 671.5,667.0938 L671.5,576.2969 L661.5,566.2969 L379.5,566.2969 A0,0 0 0 0 379.5,566.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M661.5,566.2969 L661.5,576.2969 L671.5,576.2969 L661.5,566.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263" x="385.5" y="583.3638">Composes a GainParameterization and a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258" x="385.5" y="598.4966">FeedbackControlMethod as independent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219" x="385.5" y="613.6294">strategy objects, in addition to the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271" x="385.5" y="628.7622">propagator / constraints_list / problem_def</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262" x="385.5" y="643.895">inherited from the base class. Detailed in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241" x="385.5" y="659.0278">09_stochastic_top_composition.puml.</text></g><!--reverse link TrajectoryOptimizationProblem to DeterministicTOP--><g id="link_TrajectoryOptimizationProblem_DeterministicTOP"><path codeLine="30" d="M626.9663,378.6148 C664.5363,418.5348 696.81,451.7469 738.5,492.2969 C764.9,517.9769 795.23,545.5069 820.62,568.0369 " fill="none" id="TrajectoryOptimizationProblem-backto-DeterministicTOP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="614.63,365.5069,622.597,382.7268,631.3356,374.5027,614.63,365.5069" style="stroke:#181818;stroke-width:1.0;"/></g><!--