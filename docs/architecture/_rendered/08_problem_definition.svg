<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="587px" preserveAspectRatio="none" style="width:1384px;height:587px;background:#FFFFFF;" version="1.1" viewBox="0 0 1384 587" width="1384px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="370" x="500.25" y="22.9951">Problem Definition and build_problem() Factory</text><!--class ProblemDefinition--><g id="elem_ProblemDefinition"><rect codeLine="4" fill="#F1F1F1" height="145.7813" id="ProblemDefinition" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="182" x="7" y="305.7969"/><ellipse cx="34.6" cy="321.7969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M37.5688,327.4375 Q36.9906,327.7344 36.35,327.875 Q35.7094,328.0313 35.0063,328.0313 Q32.5063,328.0313 31.1781,326.3906 Q29.8656,324.7344 29.8656,321.6094 Q29.8656,318.4844 31.1781,316.8281 Q32.5063,315.1719 35.0063,315.1719 Q35.7094,315.1719 36.35,315.3281 Q37.0063,315.4844 37.5688,315.7813 L37.5688,318.5 Q36.9438,317.9219 36.35,317.6563 Q35.7563,317.375 35.1313,317.375 Q33.7875,317.375 33.1,318.4531 Q32.4125,319.5156 32.4125,321.6094 Q32.4125,323.7031 33.1,324.7813 Q33.7875,325.8438 35.1313,325.8438 Q35.7563,325.8438 36.35,325.5781 Q36.9438,325.2969 37.5688,324.7188 L37.5688,327.4375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122" x="51.4" y="326.6436">ProblemDefinition</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="188" y1="337.7969" y2="337.7969"/><ellipse cx="18" cy="351.4453" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62" x="27" y="354.792">Sys : dict</text><ellipse cx="18" cy="367.7422" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156" x="27" y="371.0889">Boundary_Conds : dict</text><ellipse cx="18" cy="384.0391" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76" x="27" y="387.3857">N_arcs : int</text><ellipse cx="18" cy="400.3359" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91" x="27" y="403.6826">N_nodes : int</text><ellipse cx="18" cy="416.6328" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102" x="27" y="419.9795">N_subarcs : int</text><ellipse cx="18" cy="432.9297" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90" x="27" y="436.2764">toggles : dict</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="188" y1="443.5781" y2="443.5781"/></g><g id="elem_GMN3"><path d="M224.5,177.2969 L224.5,374.7969 L189.12,378.7969 L224.5,382.7969 L224.5,580.75 A0,0 0 0 0 224.5,580.75 L573.5,580.75 A0,0 0 0 0 573.5,580.75 L573.5,187.2969 L563.5,177.2969 L224.5,177.2969 A0,0 0 0 0 224.5,177.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M563.5,177.2969 L563.5,187.2969 L573.5,187.2969 L563.5,177.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219" x="230.5" y="194.3638">Replaces today's split of cfg_args /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250" x="230.5" y="209.4966">dyn_args / Sys / Boundary_Conds. Pure</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245" x="230.5" y="224.6294">config/constants - no model objects or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="230.5" y="239.7622">prepared callables live here.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="230.5" y="254.895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258" x="230.5" y="270.0278">Built ONCE, up front, by build_problem().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201" x="230.5" y="285.1606">Stored as a private attribute on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222" x="230.5" y="300.2935">Propagator, GainParameterization,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="230.5" y="315.4263">FeedbackControlMethod, and Constraint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="230.5" y="330.5591">subclasses at construction time. Never</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260" x="230.5" y="345.6919">passed through evaluate(inputs) - inputs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241" x="230.5" y="360.8247">(the optimization variables dict) is the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223" x="230.5" y="375.9575">only thing traced through jit/jacfwd.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="230.5" y="391.0903">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316" x="230.5" y="406.2231">Today's "models" dict (dynamics + measurement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269" x="230.5" y="421.356">models) is NOT part of ProblemDefinition -</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233" x="230.5" y="436.4888">each piece now lives where it's used:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262" x="238.5" y="451.6216">- dynamics model -&gt; EquationsOfMotion,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305" x="246.5" y="466.7544">composed by Propagator (07_propagator.puml)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319" x="238.5" y="481.8872">- measurement model -&gt; -measurement_model :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312" x="246.5" y="497.02">MeasurementModel on EstimatedStateFeedback</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235" x="246.5" y="512.1528">(02_feedback_control_method.puml)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288" x="230.5" y="527.2856">Both are constructed from problem_def.Sys /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236" x="230.5" y="542.4185">problem_def.Boundary_Conds during</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285" x="230.5" y="557.5513">build_problem(), but problem_def itself stays</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66" x="230.5" y="572.6841">pure data.</text></g><!--class build_problem--><g id="elem_build_problem"><rect codeLine="42" fill="#F1F1F1" height="56.2656" id="build_problem" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="241" x="733.5" y="44.2969"/><ellipse cx="748.5" cy="64.4297" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M751.4688,70.0703 Q750.8906,70.3672 750.25,70.5078 Q749.6094,70.6641 748.9063,70.6641 Q746.4063,70.6641 745.0781,69.0234 Q743.7656,67.3672 743.7656,64.2422 Q743.7656,61.1172 745.0781,59.4609 Q746.4063,57.8047 748.9063,57.8047 Q749.6094,57.8047 750.25,57.9609 Q750.9063,58.1172 751.4688,58.4141 L751.4688,61.1328 Q750.8438,60.5547 750.25,60.2891 Q749.6563,60.0078 749.0313,60.0078 Q747.6875,60.0078 747,61.0859 Q746.3125,62.1484 746.3125,64.2422 Q746.3125,66.3359 747,67.4141 Q747.6875,68.4766 749.0313,68.4766 Q749.6563,68.4766 750.25,68.2109 Q750.8438,67.9297 751.4688,67.3516 L751.4688,70.0703 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="65" x="834.5" y="60.4355">&#171;function&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209" x="762.5" y="76.2607">build_problem(config, toggles)</text><line style="stroke:#181818;stroke-width:0.5;" x1="734.5" x2="973.5" y1="84.5625" y2="84.5625"/><line style="stroke:#181818;stroke-width:0.5;" x1="734.5" x2="973.5" y1="92.5625" y2="92.5625"/></g><g id="elem_GMN7"><path d="M609,177.2969 L609,580.75 A0,0 0 0 0 609,580.75 L1099,580.75 A0,0 0 0 0 1099,580.75 L1099,187.2969 L1089,177.2969 L858,177.2969 L854,100.3169 L850,177.2969 L609,177.2969 A0,0 0 0 0 609,177.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1089,177.2969 L1089,187.2969 L1099,187.2969 L1089,177.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223" x="615" y="194.3638">High-level factory - the single entry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210" x="615" y="209.4966">point that assembles everything:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="615" y="224.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335" x="615" y="239.7622">1. problem_def = build_problem_def(config, toggles)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259" x="615" y="254.895">2. eom = CR3BPDynamics(problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288" x="635" y="270.0278">(future: other EquationsOfMotion subclasses)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360" x="615" y="285.1606">3. propagator  = StatePropagator(eom, problem_def) or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263" x="687" y="300.2935">SensitivityPropagator(eom, problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358" x="615" y="315.4263">4. gain_param  = LQRArcGains(...) / LQRFullTrajGains(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132" x="687" y="330.5591">(StochasticTOP only)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253" x="615" y="345.6919">5. controller  = TrueStateFeedback(...) /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397" x="687" y="360.8247">EstimatedStateFeedback(measurement_model, problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132" x="687" y="375.9575">(StochasticTOP only)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315" x="615" y="391.0903">6. constraints_list = [...] - one instance per active</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310" x="635" y="406.2231">toggle, each injected with the problem_def slices</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243" x="635" y="421.356">and/or propagator references it needs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="635" y="436.4888">(see 05_constraints.puml)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="439" x="615" y="451.6216">7. top = DeterministicTOP(propagator, constraints_list, problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341" x="639" y="466.7544">or StochasticTOP(propagator, gain_param, controller,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189" x="711" y="481.8872">constraints_list, problem_def)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223" x="615" y="497.02">8. init_guess = make_InitGuess(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152" x="615" y="512.1528">9. return top, init_guess</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="615" y="527.2856">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233" x="615" y="542.4185">Returns (top, init_guess). Caller then</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344" x="615" y="557.5513">does: optprob, sens = top.to_pyoptsparse(init_guess)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236" x="615" y="572.6841">(see 09_optimization_adapter.puml).</text></g><!--class TrajectoryOptimizationProblem--><g id="elem_TrajectoryOptimizationProblem"><rect fill="#F1F1F1" height="48" id="TrajectoryOptimizationProblem" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="243" x="1134.5" y="354.7969"/><ellipse cx="1149.5" cy="370.7969" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M1152.4688,376.4375 Q1151.8906,376.7344 1151.25,376.875 Q1150.6094,377.0313 1149.9063,377.0313 Q1147.4063,377.0313 1146.0781,375.3906 Q1144.7656,373.7344 1144.7656,370.6094 Q1144.7656,367.4844 1146.0781,365.8281 Q1147.4063,364.1719 1149.9063,364.1719 Q1150.6094,364.1719 1151.25,364.3281 Q1151.9063,364.4844 1152.4688,364.7813 L1152.4688,367.5 Q1151.8438,366.9219 1151.25,366.6563 Q1150.6563,366.375 1150.0313,366.375 Q1148.6875,366.375 1148,367.4531 Q1147.3125,368.5156 1147.3125,370.6094 Q1147.3125,372.7031 1148,373.7813 Q1148.6875,374.8438 1150.0313,374.8438 Q1150.6563,374.8438 1151.25,374.5781 Q1151.8438,374.2969 1152.4688,373.7188 L1152.4688,376.4375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211" x="1163.5" y="375.6436">TrajectoryOptimizationProblem</text><line style="stroke:#181818;stroke-width:0.5;" x1="1135.5" x2="1376.5" y1="386.7969" y2="386.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="1135.5" x2="1376.5" y1="394.7969" y2="394.7969"/></g><!--link build_problem to ProblemDefinition--><g id="link_build_problem_ProblemDefinition"><path codeLine="73" d="M733.42,80.0869 C570.15,91.3569 289.64,118.7869 207,177.2969 C163.67,207.9769 137.9671,255.8666 121.2771,299.8866 " fill="none" id="build_problem-to-ProblemDefinition" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="119.15,305.4969,126.0809,298.4995,120.9226,300.8216,118.6005,295.6634,119.15,305.4969" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48" x="336" y="143.3638">creates</text></g><!--link build_problem to TrajectoryOptimizationProblem--><g id="link_build_problem_TrajectoryOptimizationProblem"><path codeLine="74" d="M961.49,100.3469 C1012.02,116.7669 1070.91,141.6069 1116,177.2969 C1179.25,227.3569 1223.1307,308.1491 1242.8907,349.2591 " fill="none" id="build_problem-to-TrajectoryOptimizationProblem" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="1245.49,354.6669,1245.1962,344.8224,1243.3239,350.1604,1237.9859,348.2881,1245.49,354.6669" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113" x="1066" y="143.3638">creates &amp; returns</text></g><!--SRC=[ZLRRRkCs47ttLmpyqCfOXKbtkzskiGdGtBO5cakJl1M5G4kKpIn5gYJbG2twxpsaP5kAtOiV4ekQuSoPENF6NdebwDwQXH8LNOfIQkcbqSHrGOj6gYAhkvV9ZAvvxerj9vDSSUSsNWEdFoT4RnvRHtCgPEx3qxbfTC5jcrqONGnVt6RSvk50wlvPcqAC3bop6DjuirmgiRtbhyb46o_8okNAaodtCuBJWwWLp-7aJS7RhnsvMibedPTBvB1qT0opejNz0mK0npHEdD5zOmNiSgDBkJp6F-UvzewEI1kgaBeYitWMEOwCXM5jHSsjA2ZdIl55I5l9jQ2Li89DO72EwdgwkxsuIgcfgRH6-vGMxUkoCzW-ekwuYZlYk5YkEL1pxwrSDFWMSG9xpPSSXYbzvbBVSyihuOMLV_1GYXGsrq8K2vv_0IHlZReHVcMADFRw8W2ol2iq2XzRZ9ovfuZLDdbiiPULO7GhrYA234O5-PKrpN95OirLWzmIgUl6kncAqts3QU9NoBI6VvyGhRcLNM52DsSaqQDLgB7HgiLNgPU4bF91W6VfZvzvNhuKiOHFVKkdiVvk6Y-Y1BtabGHntb0bk4FZAX5nTMOnqktT4xAtXsb3Hp0MF5zHBKKkqE6Ns3n7Bw5z93s2Da0-Xnq1vJPYHuIZCxhwlOaetLrvOpRr3v_SLBK9HKEdTpsZvEH3Q7d_oEgcKhF-yW66tVr7WzEiEvtt4MvsRsuwNcgwSYWyEbCyUlpTyA1tI4xUPcL_bEKTDx8gacERoBdnAmAVTsm0172sefweMI5A5aSdadztzae1YiQYiR1vHNDGl_53HrJP2LKIvgmD1Ag1YGhkEPi843PC_aQ9fkExkXbDgPUBsJGCpiY4FdsYij4TfS_EUXrP6Ey128mO6IFsZr2O8mNIAoex4KHV0g4Ti410KMhe8d8q622ymDI4oQWYkyEij97Eyq3QRzW8v